# ADR-0009 prod overrides. Apply with:
#   docker compose -f compose.yaml -f compose.prod.yaml ... (scripts/deploy.sh wraps this)
#
# Differences from the dev base:
#   - all images pinned by digest (§2)         - capped json-file logging (§15)
#   - db host port removed (§6)                 - mem limits + db oom guard (§14)
#   - persistent state under /var/lib/buscasam (§7)
#   - TEI offline + pinned revision (§10)       - nginx :443 for TLS_MODE=self (§9)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports: []
    volumes:
      - /var/lib/buscasam/postgres:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    oom_score_adj: -500
    env_file: ./.env
    logging: *default-logging

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6@sha256:66db77d7856c9319bbfaf2c5b80a6d0e0ac9ff128ade09eaca1d9c20213617a4
    command:
      - "--model-id"
      - "${EMBEDDING_MODEL_ID:-intfloat/multilingual-e5-large}"
      - "--revision"
      - "${EMBEDDING_MODEL_REVISION:?set EMBEDDING_MODEL_REVISION}"
      - "--port"
      - "80"
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - /var/lib/buscasam/tei-cache:/data
    mem_limit: 3g
    logging: *default-logging

  api:
    image: ${BUSCASAM_IMAGE_REPO}/backend:${BUSCASAM_VERSION:-latest}
    env_file: ./.env
    volumes:
      - /var/lib/buscasam/blobs:/var/lib/buscasam/blobs
    logging: *default-logging

  worker_default:
    image: ${BUSCASAM_IMAGE_REPO}/backend:${BUSCASAM_VERSION:-latest}
    env_file: ./.env
    volumes:
      - /var/lib/buscasam/blobs:/var/lib/buscasam/blobs
    logging: *default-logging

  worker_ocr:
    image: ${BUSCASAM_IMAGE_REPO}/backend:${BUSCASAM_VERSION:-latest}
    env_file: ./.env
    volumes:
      - /var/lib/buscasam/blobs:/var/lib/buscasam/blobs
    mem_limit: 2g
    logging: *default-logging

  backup:
    image: ${BUSCASAM_IMAGE_REPO}/backend:${BUSCASAM_VERSION:-latest}
    env_file: ./.env
    volumes:
      - /var/lib/buscasam/blobs:/var/lib/buscasam/blobs:ro
      - /backup/buscasam:/backup/buscasam
    logging: *default-logging

  frontend:
    image: ${BUSCASAM_IMAGE_REPO}/frontend:${BUSCASAM_VERSION:-latest}
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "80:80"
      - "443:443"   # only served when TLS_MODE=self
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - /var/lib/buscasam/blobs:/var/lib/buscasam/blobs:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    logging: *default-logging

  migrate:
    image: ${BUSCASAM_IMAGE_REPO}/backend:${BUSCASAM_VERSION:-latest}
    env_file: ./.env

  certbot:
    image: certbot/certbot@sha256:0107d084c225631fc64a8313e19adb07275f7296fde338f7dfa93986c80b2e3e
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    logging: *default-logging
