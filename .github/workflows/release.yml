# ADR-0013. On a release tag: validate the production tree, build backend+frontend
# images and push to Artifact Registry, upload the infra config tarball to GCS,
# cut a GitHub Release (notes + image digests), then auto-deploy the app VM over
# IAP SSH and health-check it. No manual deploy.sh.
#
# Rollback / redeploy a prior ref without rebuilding: run this workflow manually
# (Actions > release > Run workflow) with `ref` = the tag to redeploy. Its images
# and config already live in AR/GCS, so it skips validate+build and only deploys.
#
# Repo variables (Settings > Variables) from `terraform output`:
#   WORKLOAD_IDENTITY_PROVIDER, CI_SERVICE_ACCOUNT, DEPLOY_SERVICE_ACCOUNT,
#   IMAGE_REPO, CONFIG_BUCKET, GCP_REGION, GCP_ZONE, SERVER_NAME
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing tag to redeploy (rollback). Images/config must already be published."
        required: true

# One release/deploy at a time; never interrupt an in-flight deploy.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_USER: buscasam
          POSTGRES_PASSWORD: buscasam
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buscasam -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng \
            libmagic1 poppler-utils ghostscript qpdf

      - name: Install backend dependencies from lockfile
        working-directory: backend
        run: uv sync --frozen --dev --extra ocr

      - name: Check backend quality
        working-directory: backend
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run python -m compileall -q src

      - name: Test backend
        working-directory: backend
        run: uv run pytest

      - name: Check Alembic migration graph
        working-directory: backend
        run: |
          heads="$(uv run alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1

      - name: Audit backend runtime dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --extra ocr \
            --format requirements-txt \
            > /tmp/backend-requirements.txt
          uv tool run pip-audit --requirement /tmp/backend-requirements.txt

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Audit frontend runtime dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level moderate

      - name: Check OpenAPI typed-client drift
        working-directory: backend
        run: |
          export BUSCASAM_DISABLE_DOTENV=1
          # Pin hash seed: FastAPI's default operationId does list(route.methods)[0],
          # so GET/HEAD routes (e.g. download_version) flip suffix under a random seed.
          export PYTHONHASHSEED=0
          export BUSCASAM_EMBEDDING_MODEL_REVISION="$(
            uv run python -c \
              'import json; print(json.load(open("src/buscasam/core/vendor/e5_tokenizer/manifest.json"))["revision"])'
          )"
          uv run uvicorn --factory buscasam.api.app:create_app \
            --host 127.0.0.1 --port 8000 >/tmp/buscasam-openapi.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 \
            --fail --silent --show-error \
            http://127.0.0.1:8000/openapi.json --output /tmp/openapi.json
          pnpm --dir ../frontend exec openapi-typescript \
            /tmp/openapi.json -o /tmp/schema.d.ts
          diff -u ../frontend/src/api/schema.d.ts /tmp/schema.d.ts

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Check Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Render production Compose config
        env:
          BUSCASAM_IMAGE_REPO: example.invalid/buscasam
          BUSCASAM_VERSION: ci
          EMBEDDING_MODEL_REVISION: ci-pinned-revision
        run: |
          printf '%s\n' \
            'BUSCASAM_ENV=prod' \
            'BUSCASAM_SECRET_KEY=ci-placeholder-not-for-deploy' \
            'BUSCASAM_OIDC_CLIENT_SECRET=ci-placeholder-not-for-deploy' \
            > infra/.env
          docker compose -f infra/compose.yaml -f infra/compose.prod.yaml \
            config --format json > /tmp/compose.prod.json
          python - <<'PY'
          import json

          services = json.load(open("/tmp/compose.prod.json"))["services"]
          assert not services["db"].get("ports"), "prod db must not publish ports"
          assert not services["api"].get("build"), "prod api must use published image"
          assert not services["frontend"].get("build"), "prod frontend must use published image"
          PY

      - name: Build backend image smoke test
        run: docker build backend

      - name: Build frontend image smoke test
        run: docker build frontend

  release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # cut the GitHub Release
      id-token: write   # mint the OIDC token for Workload Identity Federation
    env:
      TAG: ${{ github.ref_name }}
      IMAGE_REPO: ${{ vars.IMAGE_REPO }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build & push backend
        run: docker build -t "$IMAGE_REPO/backend:$TAG" --metadata-file /tmp/backend-meta.json --push backend

      - name: Build & push frontend
        run: docker build -t "$IMAGE_REPO/frontend:$TAG" --metadata-file /tmp/frontend-meta.json --build-arg NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN="$PH_TOKEN" --build-arg NEXT_PUBLIC_APP_VERSION="$TAG" --push frontend
        env:
          PH_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}

      - name: Package infra config
        run: |
          tar -czf config.tgz \
            infra/compose.yaml infra/compose.prod.yaml \
            infra/postgresql.conf infra/nginx infra/scripts

      - name: Upload config to GCS
        run: gcloud storage cp config.tgz "gs://${{ vars.CONFIG_BUCKET }}/$TAG/config.tgz"

      - name: Cut GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          be="$(jq -r '."containerimage.digest"' /tmp/backend-meta.json)"
          fe="$(jq -r '."containerimage.digest"' /tmp/frontend-meta.json)"
          gh release create "$TAG" --title "$TAG" --verify-tag --generate-notes \
            --notes "## Images (\`$IMAGE_REPO\`)
          - backend \`$TAG\` @ \`$be\`
          - frontend \`$TAG\` @ \`$fe\`"

  deploy:
    needs: release
    # Runs after a successful release, or standalone for a manual rollback.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      TAG: ${{ github.event.inputs.ref || github.ref_name }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Deploy to app VM over IAP
        env:
          CONFIG_BUCKET: ${{ vars.CONFIG_BUCKET }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
        run: |
          # Remote vars expand on the VM (single-quoted heredoc); TAG/CONFIG_BUCKET
          # are injected via `sudo env`. Pull this ref's config, then deploy.sh
          # (compose pull -> migrate -> up).
          cat > /tmp/remote-deploy.sh <<'REMOTE'
          set -euo pipefail
          TOKEN="$(curl -fsS -H 'Metadata-Flavor: Google' \
            http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
            | jq -r .access_token)"
          curl -fsS -H "Authorization: Bearer $TOKEN" \
            "https://storage.googleapis.com/storage/v1/b/$CONFIG_BUCKET/o/$TAG%2Fconfig.tgz?alt=media" \
            -o /tmp/config.tgz
          tar -xzf /tmp/config.tgz -C /opt/buscasam
          bash /opt/buscasam/infra/scripts/deploy.sh "$TAG"
          REMOTE
          gcloud compute ssh buscasam-app \
            --zone "$GCP_ZONE" --tunnel-through-iap --quiet \
            --command "sudo env TAG='$TAG' CONFIG_BUCKET='$CONFIG_BUCKET' bash -s" \
            < /tmp/remote-deploy.sh

      - name: Post-deploy health check
        env:
          SERVER_NAME: ${{ vars.SERVER_NAME }}
        run: |
          curl --fail --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 10 \
            "https://$SERVER_NAME/" -o /dev/null
          echo "https://$SERVER_NAME healthy after deploying $TAG"
