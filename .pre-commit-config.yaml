# Fast local feedback before a commit lands: auto-format and lint the staged
# files. This is a convenience, not the gate — full type-checking and the test
# suite run in CI (.github/workflows/ci.yml), which branch protection enforces
# and `git commit --no-verify` cannot skip. Install once: `pre-commit install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15 # keep in sync with backend/pyproject.toml ruff
    hooks:
      - id: ruff
        name: ruff (lint, backend)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/

  - repo: local
    hooks:
      # Uses the frontend's own prettier (so the tailwind plugin resolves from
      # frontend/node_modules). cd into frontend and strip the path prefix so
      # the staged repo-relative paths resolve there. Requires `pnpm install`.
      - id: prettier
        name: prettier (frontend)
        language: system
        entry: bash -c 'cd frontend && exec pnpm exec prettier --write --ignore-unknown "${@#frontend/}"' --
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md)$
