# GitGuardian config. Suppress the throwaway Postgres credential used by the
# ephemeral CI service container (.github/workflows/ci.yml + release.yml). It is
# the project name, never reaches a deployed environment, and real secrets are
# injected via GitHub Actions `secrets.*` / `vars.*` — not literals. Scoped to the
# value so the workflow files stay scanned for any genuine secret.
version: 2
secret:
  ignored-matches:
    - name: CI Postgres throwaway test password
      match: buscasam
