services:
  db:
    image: pgvector/pgvector:pg16
    container_name: buscasam-db
    environment:
      POSTGRES_USER: buscasam
      POSTGRES_PASSWORD: buscasam
      POSTGRES_DB: buscasam
    ports:
      - "5432:5432"
    volumes:
      - buscasam-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buscasam -d buscasam"]
      interval: 2s
      timeout: 3s
      retries: 30

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: buscasam-tei
    platform: linux/amd64
    profiles: ["tei"]
    environment:
      HF_HUB_ENDPOINT: https://huggingface.co
    command: ["--model-id", "intfloat/multilingual-e5-large"]
    ports:
      - "8080:80"
    volumes:
      - buscasam-tei-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 60

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: buscasam-backend
    container_name: buscasam-worker
    profiles: ["worker"]
    command: ["procrastinate", "--app=buscasam.core.jobs.app", "worker"]
    env_file: .env
    environment:
      # localhost in .env resolves to the container itself; rewrite to the
      # compose network (db, tei) and the host (ollama runs outside this file).
      BUSCASAM_DATABASE_URL: postgresql+psycopg://buscasam:buscasam@db:5432/buscasam
      BUSCASAM_TEI_URL: http://tei:80
      BUSCASAM_METADATA_LLM_URL: http://host.docker.internal:11434
      BUSCASAM_BLOB_ROOT: /app/var/blobs
    volumes:
      # Shared with the host-run backend so both see the same content-addressed store.
      - ./var/blobs:/app/var/blobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: buscasam-tunnel
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://host.docker.internal:3000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  buscasam-db-data:
  buscasam-tei-cache:
